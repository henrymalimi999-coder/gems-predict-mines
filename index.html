<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gems Mines Simulator</title>
<style>
:root{--bg:#070b16;--panel:#0d1530;--panel2:#111b3d;--line:#1f2f66;--text:#e8edff;--muted:#8e9bc4;--blue:#1ea0ff;--gem:#19c37d;--bomb:#ff4d5a;--tile:#14204a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(circle at 50% 0,#12214d,var(--bg) 60%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh;min-height:100dvh}
main{width:100%;max-width:460px;margin:0 auto;padding:clamp(10px,3vw,20px) clamp(10px,3.5vw,20px) 40px;display:grid;gap:clamp(10px,2.5vw,16px);grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stats" "board" "how" "warn"}
.top{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,12px)}
.board{grid-area:board;align-self:start}
.box.how{grid-area:how}
.box.warn{grid-area:warn}
.badge{font-size:clamp(.62rem,2.4vw,.75rem);letter-spacing:.08em;color:var(--blue);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.lang{display:flex}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;min-height:36px;font:inherit;font-size:.78rem;cursor:pointer;touch-action:manipulation}
.lang button:first-child{border-radius:99px 0 0 99px}
.lang button:last-child{border-radius:0 99px 99px 0;border-left:0}
.lang button.on{background:var(--blue);color:#001426;border-color:var(--blue);font-weight:700}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(7px,2vw,12px) 6px;text-align:center;min-width:0}
.stat span{display:block;font-size:clamp(.55rem,2.2vw,.68rem);letter-spacing:.05em;color:var(--muted);text-transform:uppercase;overflow-wrap:anywhere}
.stat b{font-size:clamp(.95rem,4vw,1.3rem)}
.board{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:clamp(14px,4vw,22px);padding:clamp(12px,4vw,24px);box-shadow:0 0 30px rgba(30,160,255,.12)}
h1{margin:0 0 clamp(10px,3vw,16px);text-align:center;font-size:clamp(1.05rem,5vw,1.6rem);letter-spacing:.14em;color:#6fc4ff;text-shadow:0 0 12px rgba(30,160,255,.8)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,2vw,12px)}
.tile{aspect-ratio:1;border-radius:clamp(8px,2.4vw,14px);background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(1.15rem,6.5vw,2rem);transition:background .25s,box-shadow .25s,transform .25s}
.tile::before{content:"";width:clamp(5px,1.6vw,8px);height:clamp(5px,1.6vw,8px);border-radius:50%;background:#2a3d7d}
.tile.pick{background:#0a6fd0;border-color:#5cc0ff;box-shadow:0 0 14px 2px rgba(30,160,255,.9)}
.tile.pick::before{background:#fff}
.tile.gem,.tile.bomb{border:0}
.tile.gem::before,.tile.bomb::before{display:none}
.tile.gem{background:rgba(25,195,125,.25)}
.tile.bomb{background:rgba(255,77,90,.25)}
.tile.pick.gem{background:var(--gem);box-shadow:0 0 14px var(--gem)}
.tile.pick.bomb{background:var(--bomb);box-shadow:0 0 14px var(--bomb)}
.ctrl{display:flex;gap:10px;margin:clamp(12px,3vw,18px) 0 8px}
.ctrl label{flex:1;min-width:0;font-size:.72rem;color:var(--muted)}
select{width:100%;min-height:44px;margin-top:4px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:1rem}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:8px 2px}
#status{color:var(--text);font-weight:600}
.bar{height:6px;background:var(--tile);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);box-shadow:0 0 8px var(--blue);transition:width 1s linear}
.btn{width:100%;margin-top:10px;min-height:48px;padding:12px;border:0;border-radius:12px;font:inherit;font-weight:700;letter-spacing:.06em;cursor:pointer;color:#02150c;background:linear-gradient(180deg,#42e08f,#16a864);touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3.5vw,18px);font-size:clamp(.8rem,3.2vw,.92rem);color:var(--muted)}
.box h2{margin:0 0 6px;font-size:.85rem;color:#ffd24d;letter-spacing:.05em}
.box.warn{border-color:#5a3a1a}
button:focus-visible,select:focus-visible{outline:2px solid #6fc4ff;outline-offset:2px}
@media (max-width:340px){.ctrl{flex-direction:column;gap:6px}.stat span{letter-spacing:0}}
@media (min-width:720px){
main{max-width:980px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"top top" "stats stats" "board how" "board warn";grid-template-rows:auto auto auto 1fr}
.box.how{align-self:start}.box.warn{align-self:start}
}
@media (min-width:1100px){main{max-width:1060px}}
@media (orientation:landscape) and (max-height:520px){h1{margin-bottom:8px}.tile{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top">
<span class="badge" id="t-badge"></span>
<span class="lang"><button id="l-en" class="on">EN</button><button id="l-sw">SW</button></span>
</div>

<div class="stats">
<div class="stat"><span id="t-rounds"></span><b id="s-rounds">0</b></div>
<div class="stat"><span id="t-obs"></span><b id="s-rate">–</b></div>
<div class="stat"><span id="t-true"></span><b id="s-exp">–</b></div>
</div>

<div class="board">
<h1>GEMS MINES</h1>
<div class="grid" id="grid"></div>
<div class="ctrl">
<label><span id="t-bombs"></span>
<select id="bombs"><option>1</option><option>3</option><option selected>5</option><option>10</option></select></label>
<label><span id="t-clean"></span>
<select disabled><option id="s-clean">0</option></select></label>
</div>
<div class="info"><span id="status"></span><span id="timer"></span></div>
<div class="bar"><i id="fill"></i></div>
</div>

<div class="box how"><h2 id="t-how-h"></h2><span id="t-how"></span></div>
</main>

<script>
(function(){
var T={
en:{badge:"SIMULATOR",rounds:"Rounds",obs:"Observed safe rate",tr:"True odds",bombs:"Bombs",clean:"All-5-safe rounds",
now:"START ROUND NOW",pause:"PAUSE",resume:"RESUME",paused:"Paused",picking:"Auto-picking 5 boxes…",ready:"Starting…",
allsafe:"All 5 boxes safe!",hit:function(n){return n+" bomb"+(n>1?"s":"")+" hit";},next:function(s){return "Next round in "+s+"s";},
howh:"HOW IT WORKS",how:"Every 60 seconds a new round starts. Bombs are placed at random, 5 boxes are picked automatically, the board is revealed and the stats update.",
warnh:"IMPORTANT",warn:"Bomb positions are random every round, so the auto-picker is just random selection. It cannot predict safe boxes, and its results converge to the true odds over time. This is a learning demo, not a betting tool."},
sw:{badge:"SIMULIZI",rounds:"Raundi",obs:"Kiwango kilichoonekana",tr:"Uwezekano wa kweli",bombs:"Mabomu",clean:"Raundi safi (5/5)",
now:"ANZA RAUNDI SASA",pause:"SIMAMISHA",resume:"ENDELEA",paused:"Imesimamishwa",picking:"Inachagua masanduku 5…",ready:"Inaanza…",
allsafe:"Masanduku yote 5 ni salama!",hit:function(n){return "Mabomu "+n+" yamepigwa";},next:function(s){return "Raundi ijayo baada ya "+s+"s";},
howh:"INAVYOFANYA KAZI",how:"Kila sekunde 60 raundi mpya huanza. Mabomu huwekwa kwa nasibu, masanduku 5 huchaguliwa kiotomatiki, matokeo hufunuliwa na takwimu husasishwa.",
warnh:"MUHIMU",warn:"Mabomu huwekwa kwa nasibu kila raundi, kwa hiyo uchaguzi huu ni wa nasibu tu. Hauwezi kutabiri masanduku salama, na matokeo hukaribia uwezekano wa kweli baada ya muda. Hii ni simulizi ya kujifunza, si zana ya kubashiri."}
};
var lang="en",N=25,PICKS=5,ROUND=60;
var $=function(id){return document.getElementById(id);};
var grid=$("grid"),tiles=[];
for(var i=0;i<N;i++){var d=document.createElement("div");d.className="tile";grid.appendChild(d);tiles.push(d);}
var rounds=0,clean=0,safe=0,total=0,running=true,left=ROUND,lastState="ready",lastN=0;

function sample(k,n){var a=[];for(var i=0;i<n;i++)a.push(i);
for(var j=n-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),x=a[j];a[j]=a[r];a[r]=x;}return a.slice(0,k);}

function render(){
var t=T[lang];
document.documentElement.lang=lang;
$("t-badge").textContent=t.badge;$("t-rounds").textContent=t.rounds;$("t-obs").textContent=t.obs;$("t-true").textContent=t.tr;
$("t-bombs").textContent=t.bombs;$("t-clean").textContent=t.clean;
$("t-how-h").textContent=t.howh;$("t-how").textContent=t.how;
$("timer").textContent=t.next(left);
var s=lastState;
$("status").textContent=!running?t.paused:s==="ready"?t.ready:s==="picking"?t.picking:s==="safe"?t.allsafe:t.hit(lastN);
$("l-en").className=lang==="en"?"on":"";$("l-sw").className=lang==="sw"?"on":"";
}

function play(){
tiles.forEach(function(x){x.className="tile";x.textContent="";});
var b=parseInt($("bombs").value,10),bs=sample(b,N),pk=sample(PICKS,N);
pk.forEach(function(p){tiles[p].classList.add("pick");});
lastState="picking";render();
setTimeout(function(){
var s=0;
pk.forEach(function(i){var isB=bs.indexOf(i)>-1;tiles[i].textContent=isB?"💣":"💎";tiles[i].classList.add(isB?"bomb":"gem");});
pk.forEach(function(p){if(bs.indexOf(p)<0)s++;});
rounds++;total+=PICKS;safe+=s;if(s===PICKS)clean++;
lastN=PICKS-s;lastState=s===PICKS?"safe":"hit";
$("s-rounds").textContent=rounds;$("s-clean").textContent=clean;
$("s-rate").textContent=(safe/total*100).toFixed(1)+"%";
$("s-exp").textContent=((1-b/N)*100).toFixed(1)+"%";
render();
},1200);
}

function startRound(){left=ROUND;$("fill").style.width="0";play();}

setInterval(function(){
if(!running)return;
left--;
if(left<=0){startRound();}
$("fill").style.width=((ROUND-left)/ROUND*100)+"%";
$("timer").textContent=T[lang].next(left);
},1000);

$("bombs").onchange=function(){rounds=clean=safe=total=0;$("s-rounds").textContent="0";$("s-clean").textContent="0";$("s-rate").textContent="–";$("s-exp").textContent="–";startRound();};
$("l-en").onclick=function(){lang="en";render();};
$("l-sw").onclick=function(){lang="sw";render();};

render();startRound();
})();
</script>
</body>
</html>
